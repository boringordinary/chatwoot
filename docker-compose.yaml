services:
  rails:
    image: ghcr.io/boringordinary/chatwoot:latest
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: always

  sidekiq:
    image: ghcr.io/boringordinary/chatwoot:latest
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    image: redis:alpine
    restart: always
    env_file:
      - .env
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
