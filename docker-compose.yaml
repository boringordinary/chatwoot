x-chatwoot-build: &chatwoot-build
  context: .
  dockerfile: docker/Dockerfile

x-chatwoot-storage-env: &chatwoot-storage-env
  ACTIVE_STORAGE_SERVICE: "${ACTIVE_STORAGE_SERVICE:-local}"
  S3_BUCKET_NAME: "${S3_BUCKET_NAME:-}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
  AWS_REGION: "${AWS_REGION:-}"
  STORAGE_ACCESS_KEY_ID: "${STORAGE_ACCESS_KEY_ID:-}"
  STORAGE_SECRET_ACCESS_KEY: "${STORAGE_SECRET_ACCESS_KEY:-}"
  STORAGE_REGION: "${STORAGE_REGION:-}"
  STORAGE_BUCKET_NAME: "${STORAGE_BUCKET_NAME:-}"
  STORAGE_ENDPOINT: "${STORAGE_ENDPOINT:-}"
  STORAGE_FORCE_PATH_STYLE: "${STORAGE_FORCE_PATH_STYLE:-false}"

services:
  rails:
    image: chatwoot-local:latest
    build: *chatwoot-build
    pull_policy: build
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    expose:
      - "3000"
    environment:
      <<: *chatwoot-storage-env
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: always

  sidekiq:
    image: chatwoot-local:latest
    build: *chatwoot-build
    pull_policy: build
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - storage_data:/app/storage
    environment:
      <<: *chatwoot-storage-env
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatwoot_production}
      POSTGRES_USER: ${POSTGRES_USERNAME:-chatwoot_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    image: redis:alpine
    restart: always
    env_file:
      - .env
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data

volumes:
  storage_data:
  postgres_data:
  redis_data:
